# InfraRender static frontend server.
# The container runs as the unprivileged nginx user: every runtime path below
# lives under /tmp, and the pid file is /tmp/nginx.pid, so the container needs
# no CAP_CHOWN / CAP_SETUID / CAP_NET_BIND_SERVICE at startup.
# This configuration is owned by this repository instead of being string-patched
# from the upstream image, so a base-image change cannot silently reintroduce the
# "/run/nginx.pid permission denied" failure mode.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Uploads are limited to 20 MiB on the backend; leave room for multipart framing.
    client_max_body_size 25m;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        # Same-origin API and media routing for the self-hosted Docker stack when
        # it runs without Caddy (docker compose local). In the Caddy deployment,
        # Caddy forwards /api, /uploads and /outputs straight to the backend, so
        # these locations are simply not reached there.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 210s;
            proxy_send_timeout 210s;
        }

        location /uploads/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /outputs/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve pre-rendered pages; fall back to index.html for SPA navigation.
        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        # Static assets have content-addressed hashes — safe to cache.
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}