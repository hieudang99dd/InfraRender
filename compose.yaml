name: infrarender

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infrarender-backend:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      INFRARENDER_CORS_ORIGINS: ${INFRARENDER_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      INFRARENDER_PUBLIC_BASE_URL: ""
    expose:
      - "8000"
    volumes:
      - infrarender_uploads:/app/uploads
      - infrarender_outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: infrarender-frontend:local
    environment:
      INFRARENDER_API_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  infrarender_uploads:
  infrarender_outputs:
