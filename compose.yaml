name: infrarender

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infrarender-backend:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      INFRARENDER_CORS_ORIGINS: ${INFRARENDER_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Leave empty for local/dev; backend uses request.url_for() to build media URLs.
      # Production overrides this to the HTTPS public URL via compose.deploy.yaml.
      INFRARENDER_PUBLIC_BASE_URL: ""
      INFRARENDER_DATA_DIR: /data
    expose:
      - "8000"
    volumes:
      # Unified persistent volume: SQLite database + uploads/ + outputs/
      - infrarender_data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: infrarender-frontend:local
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Use wget from busybox/alpine — nginx:alpine includes it; node is not present.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  infrarender_data:
    name: infrarender_data
