name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character Git SHA published by CI"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "image_tag must be a full Git SHA" >&2
            exit 2
          fi
          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS PRODUCTION_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub production secret: $name" >&2
              exit 2
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy verified image tag
        shell: bash
        run: |
          ssh -o BatchMode=yes \
            -i ~/.ssh/id_ed25519 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$PRODUCTION_PATH' && git fetch origin main && git checkout --detach '$IMAGE_TAG' && test \"\$(git rev-parse HEAD)\" = '$IMAGE_TAG' && bash ops/deploy.sh '$IMAGE_TAG'"
