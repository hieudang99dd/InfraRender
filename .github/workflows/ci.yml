name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Validate Compose
        run: |
          docker compose -f compose.yaml -f compose.local.yaml config
      - name: Build Docker images
        run: |
          docker compose -f compose.yaml -f compose.local.yaml build
      - name: Start Docker stack
        run: |
          docker compose -f compose.yaml -f compose.local.yaml up -d
      - name: Smoke test frontend to backend proxy
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml -f compose.local.yaml ps
          docker compose -f compose.yaml -f compose.local.yaml logs
          exit 1
      - name: Show container status
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml ps
      - name: Stop Docker stack
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down -v
