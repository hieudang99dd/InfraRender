name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operations scripts
        run: |
          bash -n ops/*.sh
          shellcheck ops/*.sh
      - name: Scan repository for critical vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [security, frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose
        run: |
          docker compose -f compose.yaml -f compose.local.yaml config
          mkdir -p secrets
          printf '%s' 'ci-placeholder-key' > secrets/openai_api_key.txt
          INFRARENDER_DOMAIN=render.example.com INFRARENDER_BASIC_AUTH_USER=ci INFRARENDER_BASIC_AUTH_HASH=ci-placeholder docker compose -f compose.yaml -f compose.production.yaml config
          INFRARENDER_DOMAIN=render.example.com INFRARENDER_BASIC_AUTH_USER=ci INFRARENDER_BASIC_AUTH_HASH=ci-placeholder docker compose -f compose.deploy.yaml config

      - name: Validate Caddy configuration
        run: |
          AUTH_HASH="$(docker run --rm caddy:2.11.4-alpine caddy hash-password --plaintext ci-password)"
          docker run --rm -e INFRARENDER_DOMAIN=render.example.com -e INFRARENDER_BASIC_AUTH_USER=ci -e "INFRARENDER_BASIC_AUTH_HASH=$AUTH_HASH" -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build Docker images
        run: docker compose -f compose.yaml -f compose.local.yaml build

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: infrarender-backend:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: infrarender-frontend:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Start Docker stack
        run: |
          if ! docker compose -f compose.yaml -f compose.local.yaml up -d; then
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color backend frontend
            exit 1
          fi

      - name: Smoke test frontend and backend
        run: |
          echo "Testing backend health..."
          backend_ok=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              if jq -e '.status == "ok"' /tmp/health.json > /dev/null; then
                backend_ok=1
                break
              fi
            fi
            sleep 2
          done
          
          if [ "$backend_ok" -eq 0 ]; then
            echo "Backend health check failed"
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color backend
            exit 1
          fi
          
          echo "Testing frontend availability..."
          frontend_ok=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              frontend_ok=1
              break
            fi
            sleep 2
          done
          
          if [ "$frontend_ok" -eq 0 ]; then
            echo "Frontend check failed"
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color frontend
            exit 1
          fi

      - name: Show container status
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml ps

      - name: Stop Docker stack
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down -v
