name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operations scripts
        run: |
          bash -n ops/*.sh
          shellcheck ops/*.sh
          bash ops/check_contracts.sh
      - name: Scan repository for critical vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [security, frontend, backend]
    env:
      INFRARENDER_DATA_VOLUME: infrarender_ci_data
    steps:
      - uses: actions/checkout@v4
      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose
        run: |
          docker compose -f compose.yaml -f compose.local.yaml config
          docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml config
          mkdir -p secrets
          printf '%s' 'ci-placeholder-key' > secrets/openai_api_key.txt
          printf '%s' 'ci-placeholder-pass-at-least-12-chars' > secrets/infrarender_auth_pass.txt
          INFRARENDER_DOMAIN=render.example.com \
          INFRARENDER_IMAGE_TAG=0123456789abcdef0123456789abcdef01234567 \
          docker compose -f compose.deploy.yaml config

      - name: Validate Caddy configuration
        run: |
          # Caddyfile uses only INFRARENDER_DOMAIN; no longer requires BASIC_AUTH vars
          docker run --rm \
            -e INFRARENDER_DOMAIN=render.example.com \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build Docker images
        run: docker compose -f compose.yaml -f compose.local.yaml build

      - name: Scan backend Docker image (blocking CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: infrarender-backend:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan frontend Docker image (blocking CRITICAL gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: infrarender-frontend:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Start Docker stack
        run: |
          if ! docker compose -f compose.yaml -f compose.local.yaml up -d; then
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color backend frontend
            exit 1
          fi

      - name: Smoke test frontend and backend
        run: |
          echo "Testing backend health..."
          backend_ok=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              if jq -e '.status == "ok" and .service == "InfraRender AI Backend"' /tmp/health.json > /dev/null; then
                backend_ok=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$backend_ok" -eq 0 ]; then
            echo "Backend health check failed"
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color backend
            exit 1
          fi

          echo "Testing frontend availability and content..."
          frontend_ok=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/frontend.html; then
              if grep -q "InfraRender" /tmp/frontend.html; then
                frontend_ok=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$frontend_ok" -eq 0 ]; then
            echo "Frontend check failed"
            docker compose -f compose.yaml -f compose.local.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml logs --no-color frontend
            exit 1
          fi

      - name: Smoke test self-host routing through Caddy
        run: |
          # Start Caddy in front of the same local stack. The production Caddyfile
          # is reused with INFRARENDER_DOMAIN=localhost (internal CA, no DNS needed).
          docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml up -d caddy

          echo "Testing HTTPS /api/health through Caddy..."
          api_ok=0
          for attempt in {1..30}; do
            if curl --resolve localhost:8443:127.0.0.1 -k --fail --silent --show-error --max-time 15 https://localhost:8443/api/health > /tmp/caddy-health.json; then
              if jq -e '.status == "ok" and .service == "InfraRender AI Backend"' /tmp/caddy-health.json > /dev/null; then
                api_ok=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$api_ok" -eq 0 ]; then
            echo "Self-host API routing through Caddy failed"
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml logs --no-color caddy backend frontend
            exit 1
          fi

          echo "Testing static frontend through Caddy..."
          if ! curl --resolve localhost:8443:127.0.0.1 -k --fail --silent --show-error --max-time 15 https://localhost:8443/ | grep -q "InfraRender"; then
            echo "Frontend page through Caddy missing InfraRender content"
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml logs --no-color caddy backend frontend
            exit 1
          fi

          echo "Testing /uploads routing reaches the backend (404 JSON, not SPA fallback)..."
          code="$(curl --resolve localhost:8443:127.0.0.1 -k --silent --max-time 15 -o /tmp/media-404.json -w '%{http_code}' https://localhost:8443/uploads/00000000000000000000000000000000.png)"
          if [ "$code" != "404" ] || ! grep -q '"detail"' /tmp/media-404.json; then
            echo "Unexpected /uploads response: HTTP $code $(cat /tmp/media-404.json)"
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml logs --no-color caddy backend frontend
            exit 1
          fi

          echo "Testing upload -> /uploads download round trip through Caddy..."
          python3 -c 'import base64; open("/tmp/pixel.png", "wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="))'
          curl --resolve localhost:8443:127.0.0.1 -k --fail --silent --show-error --max-time 30 \
            -F "file=@/tmp/pixel.png;type=image/png" \
            https://localhost:8443/api/upload-image > /tmp/upload.json
          if ! jq -e '.status == "success"' /tmp/upload.json > /dev/null; then
            echo "Upload through Caddy failed: $(cat /tmp/upload.json)"
            exit 1
          fi
          name="$(jq -r '.saved_name' /tmp/upload.json)"
          test -n "$name"
          echo "CI_UPLOAD_NAME=$name" >> "$GITHUB_ENV"
          curl --resolve localhost:8443:127.0.0.1 -k --fail --silent --show-error --max-time 15 "https://localhost:8443/uploads/$name" -o /tmp/downloaded.png
          if ! cmp -s /tmp/pixel.png /tmp/downloaded.png; then
            echo "Downloaded media differs from uploaded bytes"
            exit 1
          fi
          echo "Self-host routing through Caddy: PASS"

      - name: Smoke test disposable backup and restore
        run: |
          backup_root="$(mktemp -d)"
          project_name="CI recovery project"
          test -n "${CI_UPLOAD_NAME:-}"
          project_payload="$(jq -n --arg name "$project_name" --arg saved "$CI_UPLOAD_NAME" '{name: $name, workspace: {source: {saved_name: $saved}}}')"
          project_id="$(curl --resolve localhost:8443:127.0.0.1 -k --fail --silent --show-error --max-time 15 -H 'Content-Type: application/json' -d "$project_payload" https://localhost:8443/api/projects | jq -r '.id')"
          if [ -z "$project_id" ] || [ "$project_id" = "null" ]; then
            echo "Project creation failed during recovery smoke"
            exit 1
          fi

          INFRARENDER_DATA_VOLUME="$INFRARENDER_DATA_VOLUME" bash ops/backup.sh "$backup_root"
          backup_dir="$(find "$backup_root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$backup_dir"
          test -f "$backup_dir/infrarender_data.tar.gz"
          test -f "$backup_dir/SHA256SUMS"
          test -f "$backup_dir/metadata.txt"

          docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml down
          docker volume rm "$INFRARENDER_DATA_VOLUME"
          CONFIRM_RESTORE=yes INFRARENDER_DATA_VOLUME="$INFRARENDER_DATA_VOLUME" bash ops/restore.sh "$backup_dir"
          docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml up -d

          recovered=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/restored-health.json; then
              if jq -e '.status == "ok" and .service == "InfraRender AI Backend"' /tmp/restored-health.json >/dev/null; then
                recovered=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$recovered" -ne 1 ]; then
            echo "Backend did not recover after restore"
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml ps
            docker compose -f compose.yaml -f compose.local.yaml -f compose.test.yaml logs --no-color backend frontend
            exit 1
          fi
          curl --fail --silent --show-error "http://127.0.0.1:8000/api/projects/$project_id" | jq -e --arg name "$project_name" '.name == $name' >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:8000/uploads/$CI_UPLOAD_NAME" -o /tmp/restored.png
          cmp -s /tmp/pixel.png /tmp/restored.png
          rm -rf "$backup_root"
          echo "Disposable backup/restore smoke: PASS"

      - name: Show container status
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml ps

      - name: Stop Docker stack
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down -v
