name: infrarender

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-hieudang99dd}/infrarender-backend:${INFRARENDER_IMAGE_TAG:?Set INFRARENDER_IMAGE_TAG to a full Git SHA}
    environment:
      # -- Provider credentials (supply via secrets or env file on the host) --
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_PROMPT_MODEL: ${OPENAI_PROMPT_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # -- Storage: all persistent data (SQLite + uploads + outputs) under one volume --
      INFRARENDER_DATA_DIR: /data
      # Canonical retention (days) for unreferenced media. The backend runs the
      # retention sweep itself every 24 hours; there is no separate worker.
      INFRARENDER_RETENTION_DAYS: ${INFRARENDER_RETENTION_DAYS:-30}
      # -- Security & routing --
      INFRARENDER_AUTH_USER: hieu.dv
      INFRARENDER_AUTH_PASS_FILE: /run/secrets/infrarender_auth_pass
      INFRARENDER_CORS_ORIGINS: https://${INFRARENDER_DOMAIN}
      INFRARENDER_PUBLIC_BASE_URL: "https://${INFRARENDER_DOMAIN:?Set INFRARENDER_DOMAIN in the server .env file}"
    expose:
      - "8000"
    volumes:
      # Single persistent volume that holds projects.sqlite3, uploads/, and outputs/
      - infrarender_data:/data
    secrets:
      - openai_api_key
      - infrarender_auth_pass
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/${GHCR_OWNER:-hieudang99dd}/infrarender-frontend:${INFRARENDER_IMAGE_TAG:?Set INFRARENDER_IMAGE_TAG to a full Git SHA}
    # No runtime environment is needed: the static export reaches the backend
    # through the same origin, and Caddy routes /api, /uploads and /outputs to
    # the backend service.
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # wget is available in nginx:alpine; node is NOT present in the runner image.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      INFRARENDER_DOMAIN: ${INFRARENDER_DOMAIN:?Set INFRARENDER_DOMAIN in the server .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-0.50}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  infrarender_auth_pass:
    file: ./secrets/infrarender_auth_pass.txt

volumes:
  # Single volume holds: projects.sqlite3 + uploads/ + outputs/
  infrarender_data:
    name: ${INFRARENDER_DATA_VOLUME:-infrarender_data}
  caddy_data:
    name: infrarender_caddy_data
  caddy_config:
    name: infrarender_caddy_config
