services:
  - type: web
    name: infrarender-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free  # WARNING: free plan has NO persistent disk.
                # Files written to /data (SQLite, uploads, outputs) will be lost on redeploy/restart.
                # Upgrade to a paid plan and uncomment the 'disk' block below for production data durability.
    healthCheckPath: /health

    envVars:
      - key: INFRARENDER_ENV
        value: production

      - key: INFRARENDER_DATA_DIR
        value: /data  # Persistent disk mount path. Activate 'disk' block below when upgrading.

      - key: INFRARENDER_AUTH_USER
        value: "hieu.dv"

      - key: INFRARENDER_AUTH_PASS
        sync: false

      - key: INFRARENDER_CORS_ORIGINS
        value: https://hieudang99dd.github.io

      - key: OPENAI_API_KEY
        sync: false  # Enter manually in the Render dashboard â€” never commit a real key.

      - key: INFRARENDER_ACCESS_TOKEN
        sync: false  # Enter manually in the Render dashboard (min 32 characters).

      - key: INFRARENDER_PUBLIC_BASE_URL
        value: https://infrarender-backend.onrender.com

    # ---------------------------------------------------------------------------
    # UNCOMMENT the block below after upgrading to a Render paid plan (Starter+).
    # This ensures SQLite, uploaded reference images, and rendered outputs survive
    # restarts and redeployments.
    # ---------------------------------------------------------------------------
    # disk:
    #   name: infrarender-data
    #   mountPath: /data
    #   sizeGB: 10
