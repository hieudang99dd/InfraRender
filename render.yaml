services:
  - type: web
    name: infrarender-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health

    envVars:
      - key: INFRARENDER_ENV
        value: production

      - key: INFRARENDER_CORS_ORIGINS
        value: https://hieudang99dd.github.io

      - key: OPENAI_API_KEY
        sync: false

      - key: INFRARENDER_ACCESS_TOKEN
        sync: false

      - key: INFRARENDER_PUBLIC_BASE_URL
        value: https://infrarender-backend.onrender.com